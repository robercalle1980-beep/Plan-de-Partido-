<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idea de Partido</title>
<style>
  :root{
    --pitch-dark: #0d2b1f;
    --pitch: #133a29;
    --pitch-line: rgba(244,247,242,0.55);
    --chalk: #f4f7f2;
    --amber: #e8a13a;
    --muted: #9fb8a9;
    --panel: #133a29;
    --border: #2a5c42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#0a1f16;
    color: var(--chalk);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{max-width:480px; margin:0 auto; padding:14px 12px 60px;}

  header{
    padding:18px 16px 16px;
    background: linear-gradient(180deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:14px;
  }
  .eyebrow{
    font-family:'Courier New',monospace;
    letter-spacing:.18em; text-transform:uppercase;
    font-size:11px; color:var(--amber); margin:0 0 6px;
  }
  h1{
    font-family:'Arial Black', Impact, sans-serif;
    font-weight:900; font-size:24px; letter-spacing:.01em;
    margin:0 0 14px; text-transform:uppercase;
  }
  .match-meta{display:flex; gap:8px; flex-wrap:wrap;}
  .match-meta input, .match-meta select{
    flex:1; min-width:100px;
    background: rgba(255,255,255,0.06);
    border:1px solid var(--border);
    color:var(--chalk);
    border-radius:6px;
    padding:9px 10px;
    font-size:14px;
  }
  .match-meta input::placeholder{color:var(--muted);}

  .panel{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .panel h2{
    font-family:'Courier New',monospace; text-transform:uppercase;
    letter-spacing:.12em; font-size:12px; color:var(--amber); margin:0 0 12px;
  }

  /* Squad panel */
  .squad-add{display:flex; gap:8px; margin-bottom:10px;}
  .squad-add input{
    flex:1; background: rgba(255,255,255,0.06); border:1px solid var(--border);
    color:var(--chalk); border-radius:6px; padding:9px 10px; font-size:14px;
  }
  .squad-add button, .btn{
    background: var(--amber); color:#26200f; border:none; border-radius:6px;
    padding:9px 14px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn.secondary{background:transparent; border:1px solid var(--amber); color:var(--amber);}
  .btn.small{padding:6px 10px; font-size:12px;}
  .squad-list{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{
    display:flex; align-items:center; gap:6px;
    background: rgba(255,255,255,0.06); border:1px solid var(--border);
    border-radius:20px; padding:6px 8px 6px 12px; font-size:13px;
  }
  .chip button{background:none; border:none; color:#d9614f; font-size:15px; cursor:pointer; line-height:1; padding:2px;}
  .squad-hint{font-size:12px; color:var(--muted); margin-top:8px;}

  /* Half tabs */
  .half-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .half-tab{
    flex:1; text-align:center; padding:10px; border-radius:8px;
    border:1px solid var(--border); background: rgba(255,255,255,0.04);
    font-weight:700; font-size:13px; letter-spacing:.03em; cursor:pointer;
    text-transform:uppercase; color:var(--muted);
  }
  .half-tab.active{background:var(--amber); color:#26200f; border-color:var(--amber);}

  .formation-select{display:flex; gap:8px; align-items:center; margin-bottom:14px;}
  .formation-select label{font-size:12px; color:var(--muted); white-space:nowrap;}
  .formation-select select{
    flex:1; background: rgba(255,255,255,0.06); border:1px solid var(--border);
    color:var(--chalk); border-radius:6px; padding:9px 10px; font-size:14px;
  }

  /* Pitch */
  .pitch-wrap{
    position:relative; width:100%; aspect-ratio: 3/4;
    background:
      radial-gradient(circle at 50% 85%, rgba(255,255,255,0.05), transparent 55%),
      repeating-linear-gradient(0deg, #16452f 0 40px, #124025 40px 80px);
    border:2px solid var(--pitch-line); border-radius:8px; overflow:hidden;
  }
  .pitch-wrap svg{position:absolute; inset:0; width:100%; height:100%;}
  .pos-marker{
    position:absolute; transform:translate(-50%,-50%);
    width:92px; display:flex; flex-direction:column; gap:3px; align-items:center;
  }
  .pos-marker select{
    width:100%; font-size:11px; padding:4px 3px; border-radius:5px;
    border:1px solid var(--border); background:rgba(13,43,31,0.92); color:var(--chalk);
    text-align:center; text-align-last:center;
  }
  .pos-marker .min-input{
    width:46px; font-size:11px; padding:3px; border-radius:5px;
    border:1px solid var(--border); background:rgba(13,43,31,0.92); color:var(--chalk);
    text-align:center;
  }
  .pos-marker .min-row{display:flex; align-items:center; gap:3px; font-size:10px; color:var(--muted);}
  .pos-tag{
    font-family:'Courier New',monospace; font-size:9px; letter-spacing:.06em;
    color:var(--amber); text-transform:uppercase; text-shadow:0 1px 2px #000;
  }

  .actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .warn{
    margin-top:10px; font-size:12px; padding:8px 10px; border-radius:6px;
    background:#5c2e28; color:#f3c5bb; display:none;
  }
  .warn.show{display:block;}

  /* Summary */
  table.summary{width:100%; border-collapse:collapse; margin-top:4px;}
  table.summary th{
    font-family:'Courier New',monospace; text-transform:uppercase; font-size:10px;
    color:var(--muted); text-align:left; padding:4px 6px; border-bottom:1px solid var(--border);
  }
  table.summary td{padding:6px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.06);}
  table.summary td.num{text-align:center;}
  table.summary tr.zero td{color:#f3c5bb;}
  .total-badge{
    display:inline-block; padding:2px 8px; border-radius:5px; font-weight:700; font-size:12px;
    background:#24503a; color:#bfe6cd;
  }
  .total-badge.zero{background:#5c2e28; color:#f3c5bb;}

  /* Print sheet (hidden on screen, used for printing) */
  #print-sheet{display:none;}

  @media print{
    body{background:#fff; color:#000;}
    .wrap > *{display:none !important;}
    #print-sheet{display:block !important;}
    .p-half{page-break-inside:avoid; margin-bottom:22px;}
    .p-title{font-family:Arial, sans-serif; font-weight:900; font-size:20px; margin:0 0 4px;}
    .p-meta{font-size:13px; color:#333; margin-bottom:14px;}
    .p-half h3{font-family:'Courier New',monospace; text-transform:uppercase; font-size:13px; border-bottom:1px solid #999; padding-bottom:4px;}
    table.p-table{width:100%; border-collapse:collapse; font-size:13px;}
    table.p-table th, table.p-table td{border:1px solid #ccc; padding:5px 8px; text-align:left;}
    table.p-table th{background:#eee;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Idea de partido</p>
    <h1>Alineación y minutos</h1>
    <div class="match-meta">
      <input id="rival" type="text" placeholder="Rival">
      <select id="lugar">
        <option value="Casa">Casa</option>
        <option value="Fuera">Fuera</option>
      </select>
      <input id="fecha" type="date">
    </div>
  </header>

  <div class="panel">
    <h2>Plantilla</h2>
    <div class="squad-add">
      <input id="new-player" type="text" placeholder="Nombre del jugador" maxlength="30">
      <button class="btn" onclick="addPlayer()">Añadir</button>
    </div>
    <div class="squad-list" id="squad-list"></div>
    <p class="squad-hint">Se guarda en este dispositivo — solo hace falta rellenarla una vez.</p>
  </div>

  <div class="half-tabs">
    <div class="half-tab" id="tab-1" onclick="setHalf(1)">1ª parte</div>
    <div class="half-tab" id="tab-2" onclick="setHalf(2)">2ª parte</div>
  </div>

  <div class="panel">
    <div class="formation-select">
      <label>Sistema</label>
      <select id="formation-select" onchange="onFormationChange()"></select>
    </div>
    <div class="pitch-wrap" id="pitch"></div>
    <p class="squad-hint" id="pending-hint" style="margin-top:10px;"></p>
  </div>

  <div class="panel">
    <h2>Minutos de todo el equipo</h2>
    <table class="summary" id="summary-table"></table>
    <p class="squad-hint">Suma de minutos de la 1ª y la 2ª parte. Los que están a 0 no tienen ningún minuto asignado todavía.</p>
  </div>

  <div class="actions">
    <button class="btn" onclick="generatePrint(); window.print();">Imprimir / Guardar PDF</button>
    <button class="btn secondary" onclick="copyFromOtherHalf()">Copiar la otra parte</button>
  </div>

</div>

<div id="print-sheet"></div>

<script>
/* ---------- Formaciones (fútbol 8: 1 portero + 7 de campo) ---------- */
const FORMATIONS = {
  "1-3-3-1": [1,3,3,1],
  "1-2-3-2": [1,2,3,2],
  "1-3-2-2": [1,3,2,2],
  "1-2-4-1": [1,2,4,1],
  "1-4-2-1": [1,4,2,1],
  "1-3-1-3": [1,3,1,3],
  "1-2-2-3": [1,2,2,3]
};
const LINE_NAMES = ["Portero","Defensa","Medio","Delantero"];

/* ---------- Estado ---------- */
let players = []; // {id, name}
let nextId = 1;
let currentHalf = 1;
let halves = {
  1: { formation: "1-3-3-1", lineup: {} }, // lineup[posKey] = {playerId, minutes}
  2: { formation: "1-3-3-1", lineup: {} }
};

/* ---------- Persistencia (localStorage, solo este dispositivo) ---------- */
function saveSquad(){
  try{ localStorage.setItem('idea-partido-squad', JSON.stringify({players, nextId})); }catch(e){}
}
function loadSquad(){
  try{
    const raw = localStorage.getItem('idea-partido-squad');
    if(raw){
      const data = JSON.parse(raw);
      players = data.players || [];
      nextId = data.nextId || (players.length ? Math.max(...players.map(p=>p.id))+1 : 1);
    }
  }catch(e){}
}

/* ---------- Plantilla ---------- */
function addPlayer(){
  const input = document.getElementById('new-player');
  const name = input.value.trim();
  if(!name) return;
  players.push({id: nextId++, name});
  input.value = '';
  input.focus();
  saveSquad();
  renderSquad();
  renderPitch();
  renderSummary();
}
function removePlayer(id){
  players = players.filter(p => p.id !== id);
  saveSquad();
  renderSquad();
  renderPitch();
  renderSummary();
}
function renderSquad(){
  const div = document.getElementById('squad-list');
  div.innerHTML = players.map(p =>
    `<span class="chip">${escapeHtml(p.name)}<button onclick="removePlayer(${p.id})" title="Quitar">×</button></span>`
  ).join('') || '<span style="color:var(--muted); font-size:13px;">Añade tu plantilla para poder elegirlos en el campo.</span>';
}

/* ---------- Partes ---------- */
function setHalf(h){
  currentHalf = h;
  document.getElementById('tab-1').classList.toggle('active', h===1);
  document.getElementById('tab-2').classList.toggle('active', h===2);
  document.getElementById('formation-select').value = halves[h].formation;
  renderPitch();
}
function copyFromOtherHalf(){
  const other = currentHalf === 1 ? 2 : 1;
  halves[currentHalf] = JSON.parse(JSON.stringify(halves[other]));
  document.getElementById('formation-select').value = halves[currentHalf].formation;
  renderPitch();
  renderSummary();
}

/* ---------- Formación / campo ---------- */
function populateFormationSelect(){
  const sel = document.getElementById('formation-select');
  sel.innerHTML = Object.keys(FORMATIONS).map(k => `<option value="${k}">${k}</option>`).join('');
}
function onFormationChange(){
  const val = document.getElementById('formation-select').value;
  halves[currentHalf].formation = val;
  halves[currentHalf].lineup = {}; // nuevo sistema, reinicia las posiciones de esta parte
  renderPitch();
  renderSummary();
}

function positionsForFormation(key){
  const lines = FORMATIONS[key];
  const positions = [];
  const n = lines.length;
  lines.forEach((count, li) => {
    // y: portero abajo (92%), delantera arriba (10%)
    const y = 92 - (li * (78/(n-1)));
    for(let i=0; i<count; i++){
      const x = (100/(count+1)) * (i+1);
      positions.push({
        key: li+'-'+i,
        line: LINE_NAMES[li] || ('Línea '+(li+1)),
        x, y
      });
    }
  });
  return positions;
}

function renderPitch(){
  const pitch = document.getElementById('pitch');
  const formation = halves[currentHalf].formation;
  const positions = positionsForFormation(formation);
  const lineup = halves[currentHalf].lineup;

  const svgLines = `
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <line x1="4" y1="50" x2="96" y2="50" stroke="rgba(244,247,242,0.35)" stroke-width="0.4"/>
      <circle cx="50" cy="50" r="9" fill="none" stroke="rgba(244,247,242,0.35)" stroke-width="0.4"/>
      <rect x="20" y="2" width="60" height="14" fill="none" stroke="rgba(244,247,242,0.35)" stroke-width="0.4"/>
      <rect x="20" y="84" width="60" height="14" fill="none" stroke="rgba(244,247,242,0.35)" stroke-width="0.4"/>
    </svg>`;

  const markers = positions.map(pos => {
    const entry = lineup[pos.key] || {playerId:'', minutes:''};
    const takenByOthers = new Set(
      Object.entries(lineup)
        .filter(([k,v]) => k !== pos.key && v.playerId)
        .map(([k,v]) => String(v.playerId))
    );
    const availablePlayers = players.filter(p => !takenByOthers.has(String(p.id)));
    const opts = `<option value="">—</option>` +
      availablePlayers.map(p =>
        `<option value="${p.id}" ${String(p.id)===String(entry.playerId)?'selected':''}>${escapeHtml(p.name)}</option>`
      ).join('');
    return `
      <div class="pos-marker" style="left:${pos.x}%; top:${pos.y}%;">
        <span class="pos-tag">${pos.line}</span>
        <select onchange="setLineup('${pos.key}','playerId',this.value)">
          ${opts}
        </select>
        <div class="min-row">
          min
          <input class="min-input" type="number" min="0" max="90" value="${entry.minutes}" placeholder="0"
                 onchange="setLineup('${pos.key}','minutes',this.value)">
        </div>
      </div>`;
  }).join('');

  const assignedCount = Object.values(lineup).filter(v => v.playerId).length;
  const pending = positions.length - assignedCount;

  pitch.innerHTML = svgLines + markers;
  document.getElementById('pending-hint').textContent =
    pending > 0 ? `Faltan ${pending} posición${pending===1?'':'es'} por asignar.` : 'Once completo para esta parte.';
}

function setLineup(posKey, field, value){
  const lineup = halves[currentHalf].lineup;
  if(!lineup[posKey]) lineup[posKey] = {playerId:'', minutes:''};
  lineup[posKey][field] = value;
  renderPitch();
  renderSummary();
}

/* ---------- Resumen de minutos (todos los jugadores) ---------- */
function minutesByPlayer(){
  const totals = {};
  players.forEach(p => totals[p.id] = {name: p.name, h1: 0, h2: 0});
  [1,2].forEach(h => {
    Object.values(halves[h].lineup).forEach(entry => {
      if(entry.playerId && totals[entry.playerId] !== undefined){
        const mins = parseInt(entry.minutes) || 0;
        totals[entry.playerId]['h'+h] += mins;
      }
    });
  });
  return players.map(p => ({
    name: p.name,
    h1: totals[p.id].h1,
    h2: totals[p.id].h2,
    total: totals[p.id].h1 + totals[p.id].h2
  }));
}
function renderSummary(){
  const rows = minutesByPlayer();
  const table = document.getElementById('summary-table');
  if(rows.length === 0){
    table.innerHTML = `<tr><td style="color:var(--muted); font-size:13px;">Añade jugadores a la plantilla para ver aquí sus minutos.</td></tr>`;
    return;
  }
  const sorted = [...rows].sort((a,b) => a.total - b.total);
  const head = `<tr><th>Jugador</th><th class="num">1ª</th><th class="num">2ª</th><th class="num">Total</th></tr>`;
  const body = sorted.map(r => `
    <tr class="${r.total===0?'zero':''}">
      <td>${escapeHtml(r.name)}</td>
      <td class="num">${r.h1}'</td>
      <td class="num">${r.h2}'</td>
      <td class="num"><span class="total-badge ${r.total===0?'zero':''}">${r.total}'</span></td>
    </tr>`).join('');
  table.innerHTML = head + body;
}


function playerName(id){
  const p = players.find(pl => pl.id == id);
  return p ? p.name : '—';
}
function generatePrint(){
  const rival = document.getElementById('rival').value || 'Rival sin especificar';
  const lugar = document.getElementById('lugar').value;
  const fecha = document.getElementById('fecha').value;
  const fechaFmt = fecha ? new Date(fecha+'T00:00:00').toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'}) : '';

  let html = `<div class="p-title">Idea de partido — vs ${escapeHtml(rival)}</div>
    <div class="p-meta">${lugar}${fechaFmt ? ' · ' + fechaFmt : ''}</div>`;

  [1,2].forEach(h => {
    const data = halves[h];
    const positions = positionsForFormation(data.formation);
    let rows = positions.map(pos => {
      const entry = data.lineup[pos.key] || {};
      return `<tr><td>${pos.line}</td><td>${escapeHtml(playerName(entry.playerId))}</td><td>${entry.minutes || '—'}'</td></tr>`;
    }).join('');
    html += `<div class="p-half">
      <h3>${h}ª parte — sistema ${data.formation}</h3>
      <table class="p-table">
        <thead><tr><th>Posición</th><th>Jugador</th><th>Minutos</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  });

  const summaryRows = [...minutesByPlayer()].sort((a,b) => a.total - b.total);
  const summaryBody = summaryRows.map(r =>
    `<tr><td>${escapeHtml(r.name)}</td><td>${r.h1}'</td><td>${r.h2}'</td><td><b>${r.total}'</b></td></tr>`
  ).join('');
  html += `<div class="p-half">
    <h3>Minutos de todo el equipo</h3>
    <table class="p-table">
      <thead><tr><th>Jugador</th><th>1ª parte</th><th>2ª parte</th><th>Total</th></tr></thead>
      <tbody>${summaryBody}</tbody>
    </table>
  </div>`;

  document.getElementById('print-sheet').innerHTML = html;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

/* ---------- Init ---------- */
loadSquad();
populateFormationSelect();
renderSquad();
setHalf(1);
renderSummary();
</script>
</body>
</html>
